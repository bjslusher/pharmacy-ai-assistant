name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.9.9"
          src: "backend"
          args: "check"
      - name: Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.9.9"
          src: "backend"
          args: "format --check"

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest python-multipart ruff
      - name: Ruff lint (backend)
        run: |
          ruff check .
          ruff format --check .
      - name: Syntax check
        run: python -m py_compile main.py prompts.py rag_service.py
      - name: Unit tests
        run: |
          pytest -q tests/test_expand_query.py tests/test_api_models.py
          pytest -q tests/test_rag_helpers.py
      - name: Integration tests (mocked RAG)
        run: pytest -q tests/test_integration_api.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build
        run: |
          npm ci || npm install
          npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t pharmacy-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t pharmacy-frontend:ci ./frontend
