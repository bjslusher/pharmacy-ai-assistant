name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Syntax check
        run: python -m py_compile main.py prompts.py rag_service.py
      - name: Unit tests
        run: |
          # No live Ollama required — expand_query + model tests are pure unit tests
          pytest -q tests/test_expand_query.py tests/test_api_models.py
          # RAG helpers mock embeddings/LLM
          pytest -q tests/test_rag_helpers.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and build
        run: |
          npm ci || npm install
          npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t pharmacy-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t pharmacy-frontend:ci ./frontend
