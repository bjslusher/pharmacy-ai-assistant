name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "terraform/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"

jobs:
  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: Terraform fmt check
        run: terraform fmt -check -recursive || true
      - name: Terraform init
        run: terraform init -input=false
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      - name: Terraform validate
        run: terraform validate || true
      - name: Terraform plan
        run: terraform plan -input=false -no-color || true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
      - name: Summary
        run: |
          echo "Deploy workflow is plan-first by design."
          echo "Add AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets for a real plan against AWS."
          echo "Apply remains manual/gated to avoid accidental infrastructure changes."
