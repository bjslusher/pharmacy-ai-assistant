services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=http://ollama:11434
      # Small model: RAG quality test, not world knowledge
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - OLLAMA_NUM_PREDICT=${OLLAMA_NUM_PREDICT:-350}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-2048}
      - RAG_TOP_K=${RAG_TOP_K:-3}
      - CHROMA_PATH=/app/chroma_db
      - DATA_PATH=/app/source_data
      - MEM0_API_KEY=${MEM0_API_KEY:-}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
    volumes:
      - ./backend/source_data:/app/source_data:ro
      - chroma_data:/app/chroma_db
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # NVIDIA GPU (4070 Ti etc.) — requires NVIDIA Container Toolkit / Docker Desktop GPU
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    gpus: all
    restart: unless-stopped

volumes:
  chroma_data:
  ollama_data:
