[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "N",   # pep8-naming
]
ignore = [
  "E501",  # line length handled by formatter preference / docs strings
]

[tool.ruff.lint.per-file-ignores]
# load_dotenv() must run before local imports
"main.py" = ["E402"]
"tests/*" = ["E402", "N802", "N803"]

[tool.ruff.lint.isort]
known-first-party = ["prompts", "rag_service", "main"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
